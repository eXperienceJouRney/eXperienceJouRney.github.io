<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML 编辑器 · eXperience JouRney</title>
<link rel="icon" href="../../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="../../assets/favicon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<!-- 主题令牌：与个人主页共用同一份，颜色只在这里定义 -->
<link rel="stylesheet" href="../../assets/theme.css?v=5">
<link rel="stylesheet" href="editor.css?v=17">
</head>
<body>

<header class="bar">
  <div class="brand"><a href="../../works.html" title="返回作品">HTML 编辑器</a> <span class="ver">v16</span></div>

  <div class="group">
    <label class="btn primary" for="dirInput">打开 HTML</label>
    <input id="dirInput" type="file" webkitdirectory directory multiple hidden>
  </div>

  <div class="group seg">
    <button class="btn seg-b on" data-mode="read">阅读</button>
    <button class="btn seg-b" data-mode="edit">编辑</button>
  </div>

  <div class="group">
    <button class="btn" id="minus" title="缩小字号">A－</button>
    <button class="btn" id="plus" title="放大字号">A＋</button>
    <button class="btn" id="theme" title="切换日夜">夜间</button>
  </div>

  <div class="group right">
    <span class="file" id="fileName"></span>
    <button class="btn off" id="noteBtn">加批注</button>
    <button class="btn off" id="panelBtn">批注 <b id="noteN">0</b></button>
    <button class="btn off" id="chgBtn">改动 <b id="chgN">0</b></button>
    <button class="btn primary off" id="exportHtml">导出 HTML</button>
    <button class="btn off" id="exportLog">导出记录</button>
  </div>
</header>

<main class="stage" id="stage">
  <iframe id="book" title="HTML 内容"></iframe>

  <div class="drop" id="drop">
    <div class="hero">
      <h1>HTML 编辑器</h1>
      <p class="tag">划线、批注、改错，然后导出一份干净的 HTML</p>

      <div class="cta">
        <label class="btn-hero" for="dirInput">打开 HTML</label>
        <span class="or">或把 <code>web</code> 文件夹直接拖进来</span>
      </div>

      <div class="note">
        <p>要选含 <code>index.html</code> 和 <code>assets/</code> 的文件夹（通常是 <code>web/</code>），插图才会显示。</p>
        <p>全部处理都在你的浏览器里完成，不会上传到任何服务器。</p>
      </div>
    </div>
  </div>
</main>

<!-- 选中文字后浮出的标注工具条 -->
<div class="fab" id="fab" hidden>
  <button data-tag="mark" title="高亮（再点一次取消）"><span class="mk">高</span></button>
  <button data-tag="strong" title="加粗（再点一次取消）"><b>B</b></button>
  <button data-tag="u" title="下划线（再点一次取消）"><u>U</u></button>
  <button data-tag="s" title="删除线（再点一次取消）"><s>S</s></button>
  <span class="fab-sep"></span>
  <button data-tag="size-" title="缩小字号"><span class="sz">A－</span></button>
  <button data-tag="size+" title="放大字号"><span class="sz">A＋</span></button>
  <span class="fab-sep"></span>
  <label class="fab-col" title="文字颜色">
    <input type="color" id="fabColor" value="#0071e3">
  </label>
  <span class="fab-sep"></span>
  <button data-tag="note" title="对这一块加批注">✎</button>
  <button data-tag="clear" title="清除所选文字的全部格式">✕</button>
</div>

<!-- 批注 / 改动 侧栏 -->
<aside class="panel" id="panel" hidden>
  <div class="panel-head">
    <div class="tabs">
      <button class="tab on" data-tab="notes">批注 <b id="tNoteN">0</b></button>
      <button class="tab" data-tab="changes">改动 <b id="tChgN">0</b></button>
    </div>
    <button class="x" id="panelClose" title="关闭">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<!-- 加批注的小弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="mbox">
    <h3 id="mTitle">给这一块加批注</h3>
    <div class="mctx" id="mCtx"></div>
    <textarea id="mText" placeholder="例如：这段 OCR 错字 / 此处理解有疑问 / 重点"></textarea>
    <div class="mact">
      <button class="btn" id="mDel" hidden>删除批注</button>
      <span class="spacer"></span>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mOk">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="editor.js?v=16"></script>
</body>
</html>
